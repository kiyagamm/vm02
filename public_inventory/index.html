<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kavana Tools POS</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header><div class="logo">KT</div><div><strong>Kavana Tools</strong><small>Inventory & POS</small></div></header>
    <section class="layout">
      <div class="panel"><div class="panel-head"><h1>Point of Sale</h1><input id="search" placeholder="Search products"></div><div id="products" class="products"></div></div>
      <aside class="panel cart"><div class="panel-head"><h2>Cart</h2><button id="clear">Clear</button></div><div id="cart"></div><div class="total"><span>Total</span><strong id="total">$0.00</strong></div><label>Payment<select id="payment"><option value="cash">Cash</option><option value="card">Card</option><option value="mobile">Mobile Money</option></select></label><label>Cash tendered<input id="tendered" type="number" min="0" step="0.01"></label><button id="checkout" class="checkout">Complete Sale</button><p id="message"></p></aside>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
